name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typpruefung
        run: npm run lint

      - name: Tests mit Abdeckung
        run: npm run test:coverage

      - name: Build
        run: npm run build

  browser:
    name: Durchspiel im Browser
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Chromium holen
        run: npx playwright install --with-deps chromium

      - name: Client bauen
        run: npm run build

      - name: Durchspiel-Tests
        run: npm run test:e2e

      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: playwright-report/
          retention-days: 7
