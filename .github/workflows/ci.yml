name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typpruefung
        run: npm run lint

      - name: Tests mit Abdeckung
        run: npm run test:coverage

      - name: Build
        run: npm run build

  browser:
    name: Durchspiel im Browser
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Chromium holen
        run: npx playwright install --with-deps chromium

      - name: Client bauen
        run: npm run build

      - name: Durchspiel-Tests
        run: npm run test:e2e

      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: playwright-report/
          retention-days: 7

  container:
    name: Container
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4

      - name: Abbild bauen
        run: docker build -t wunschkalender:pruefung .

      # Ein Abbild, das nie gestartet wurde, ist eine Behauptung. Die drei
      # Proben darunter sind der Beleg, dass es traegt.
      - name: Behaelter starten und auf Antwort warten
        run: |
          docker run -d --name wk -p 3000:3000 wunschkalender:pruefung
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "Behaelter antwortet."
              exit 0
            fi
            sleep 2
          done
          echo "Behaelter antwortet nach 60 s nicht."
          docker logs wk
          exit 1

      - name: Die Oberflaeche wird ausgeliefert
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          test "$code" = "200" || { echo "GET / lieferte $code statt 200"; exit 1; }

      - name: Die Absicherung ist im Abbild wirklich drin
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/wishes)
          test "$code" = "401" || { echo "GET /api/wishes lieferte $code statt 401"; exit 1; }

      - name: Der Prozess laeuft nicht als root
        run: |
          uid=$(docker run --rm wunschkalender:pruefung id -u)
          test "$uid" != "0" || { echo "Der Behaelter laeuft als root."; exit 1; }

      - name: Protokoll bei Fehlschlag
        if: failure()
        run: docker logs wk || true

  schranken:
    name: Schranken fuer Routine-Zweige
    runs-on: ubuntu-latest
    # Kein `if:` mehr: Dieser Auftrag laeuft bei JEDEM Pull-Request. Ob die
    # Schranken gelten, entscheidet das Skript selbst anhand des Zweignamens
    # — ein uebersprungener Auftrag gilt bei Required Status Checks als
    # bestanden, siehe docs/routinen.md.
    steps:
      - uses: actions/checkout@v4
        with:
          # Ohne die ganze Historie findet `git merge-base` den Vergleichspunkt
          # nicht, und der Diff waere leer — die Pruefung liefe ins Leere.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: Dieser Auftrag braucht nur die Pakete zum Auflisten
      # der Browsertests, keine Installationsskripte — ein neues `postinstall`
      # im geprueften Pull-Request soll den Arbeitsbaum nicht vor der Pruefung
      # umschreiben koennen.
      - run: npm ci --ignore-scripts

      # Direkter node-Aufruf statt "npm run pruefe:routine": npm fuehrt bei
      # JEDEM "npm run <name>" automatisch ein vorhandenes "pre<name>" aus -
      # ein neu hinzugefuegtes "prepruefe:routine" haette sonst vor dieser
      # Pruefung beliebigen Code mit Schreibrecht auf den Arbeitsbaum laufen
      # lassen koennen. Und ${{ github.head_ref }} laeuft ueber env: in eine
      # Shell-Variable statt direkt in "run:" interpoliert zu werden - Git
      # erlaubt in Zweignamen Anfuehrungszeichen, Dollarzeichen und Semikolons,
      # eine direkte Interpolation waere eine Befehlsinjektion.
      - name: Schranken pruefen
        env:
          BASIS: origin/${{ github.base_ref }}
          ZWEIG: ${{ github.head_ref }}
        run: node tools/pruefe-routine.mjs "$BASIS" "$ZWEIG"
