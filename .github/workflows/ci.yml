name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typpruefung
        run: npm run lint

      - name: Tests mit Abdeckung
        run: npm run test:coverage

      - name: Build
        run: npm run build

  browser:
    name: Durchspiel im Browser
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Chromium holen
        run: npx playwright install --with-deps chromium

      - name: Client bauen
        run: npm run build

      - name: Durchspiel-Tests
        run: npm run test:e2e

      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: playwright-report/
          retention-days: 7

  schranken:
    name: Schranken fuer Routine-Zweige
    runs-on: ubuntu-latest
    # Kein `if:` mehr: Dieser Auftrag laeuft bei JEDEM Pull-Request. Ob die
    # Schranken gelten, entscheidet das Skript selbst anhand des Zweignamens
    # — ein uebersprungener Auftrag gilt bei Required Status Checks als
    # bestanden, siehe docs/routinen.md.
    steps:
      - uses: actions/checkout@v4
        with:
          # Ohne die ganze Historie findet `git merge-base` den Vergleichspunkt
          # nicht, und der Diff waere leer — die Pruefung liefe ins Leere.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: Dieser Auftrag braucht nur die Pakete zum Auflisten
      # der Browsertests, keine Installationsskripte — ein neues `postinstall`
      # im geprueften Pull-Request soll den Arbeitsbaum nicht vor der Pruefung
      # umschreiben koennen.
      - run: npm ci --ignore-scripts

      # Direkter node-Aufruf statt "npm run pruefe:routine": npm fuehrt bei
      # JEDEM "npm run <name>" automatisch ein vorhandenes "pre<name>" aus -
      # ein neu hinzugefuegtes "prepruefe:routine" haette sonst vor dieser
      # Pruefung beliebigen Code mit Schreibrecht auf den Arbeitsbaum laufen
      # lassen koennen. Und ${{ github.head_ref }} laeuft ueber env: in eine
      # Shell-Variable statt direkt in "run:" interpoliert zu werden - Git
      # erlaubt in Zweignamen Anfuehrungszeichen, Dollarzeichen und Semikolons,
      # eine direkte Interpolation waere eine Befehlsinjektion.
      - name: Schranken pruefen
        env:
          BASIS: origin/${{ github.base_ref }}
          ZWEIG: ${{ github.head_ref }}
        run: node tools/pruefe-routine.mjs "$BASIS" "$ZWEIG"
