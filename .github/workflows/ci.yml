name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typpruefung
        run: npm run lint

      - name: Tests mit Abdeckung
        run: npm run test:coverage

      - name: Build
        run: npm run build

  browser:
    name: Durchspiel im Browser
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Chromium holen
        run: npx playwright install --with-deps chromium

      - name: Client bauen
        run: npm run build

      - name: Durchspiel-Tests
        run: npm run test:e2e

      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: playwright-report/
          retention-days: 7

  schranken:
    name: Schranken fuer Routine-Zweige
    runs-on: ubuntu-latest
    # Kein `if:` mehr: Dieser Auftrag laeuft bei JEDEM Pull-Request. Ob die
    # Schranken gelten, entscheidet das Skript selbst anhand des Zweignamens
    # — ein uebersprungener Auftrag gilt bei Required Status Checks als
    # bestanden, siehe docs/routinen.md.
    steps:
      - uses: actions/checkout@v4
        with:
          # Ohne die ganze Historie findet `git merge-base` den Vergleichspunkt
          # nicht, und der Diff waere leer — die Pruefung liefe ins Leere.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: Dieser Auftrag braucht nur die Pakete zum Auflisten
      # der Browsertests, keine Installationsskripte — ein neues `postinstall`
      # im geprueften Pull-Request soll den Arbeitsbaum nicht vor der Pruefung
      # umschreiben koennen.
      - run: npm ci --ignore-scripts

      - name: Schranken pruefen
        run: npm run pruefe:routine -- origin/${{ github.base_ref }} "${{ github.head_ref }}"
